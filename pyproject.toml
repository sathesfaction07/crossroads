[project]
name = "crossroads"
version = "1.0.0"
description = "Five evidence-graded engineering decision cards with stdlib reference implementations, an authoring schema, and the depth gate that enforces it"
readme = "README.md"
requires-python = ">=3.11"
# Deliberately no dependencies: every [executed] claim must be reproducible
# with the standard library alone, so there is nothing to pin or break.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
target-version = "py311"
line-length = 100
# cards/ holds the executed evidence: each card records its files' line counts and the
# validator checks them, so reformatting that code would silently break the cards' claims.
extend-exclude = ["cards"]

[tool.ruff.lint]
# Pinned, so the result does not move with ruff's default rule set between releases.
select = ["E", "F", "I", "W"]
